name: NASA Project CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    env:
      CI: true
      MONGO_URL: mongodb://127.0.0.1:27017/nasa
    strategy:
      matrix:
        node-version: [20.19.x]
        mongodb-version: ['7.0']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node-version }} 
      - name: Use mongodb from github actions
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
      - run: npm install
      - name: Check versions
        run: |
            node --version
            npm --version
            npm ls mongoose mongodb --prefix server
      - name: Test MongoDB driver connection
        run: |
          node - <<'NODE'
          const { MongoClient } = require('./server/node_modules/mongodb');

          const client = new MongoClient(process.env.MONGO_URL);

          client.connect()
          .then(async () => {
            console.log('✅ MongoDB driver connection successful');
            await client.close();
          })
          .catch((err) => {
            console.error('❌ MongoDB driver connection failed');
            console.error(err);
            process.exit(1);
          });
          NODE
      - run: npm run build --prefix client
      - run: npm test



